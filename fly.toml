# fly.toml app configuration file generated for terminal-store on 2026-11-13T12:39:04-07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'terminal-store'
primary_region = 'lax'

[build]
  [build.args]
    GO_VERSION = '1.27.1'

[mounts]
  source = "wish_data"
  destination = "/data"

# 2. Raw TCP service for Wish SSH & SFTP
[[services]]
  protocol = "tcp"
  internal_port = 2222 # The port your Go Wish app listens on internally
  auto_stop_machines = "suspend" # Or "off" — Fly wakes machines on TCP syn!
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 22
    handlers = [] # CRITICAL: Must be empty for raw SSH/SFTP traffic

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
