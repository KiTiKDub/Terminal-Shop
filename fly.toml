# fly.toml app configuration file generated for terminal-store on 2026-11-13T12:39:04-07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'terminal-store'
primary_region = 'lax'

[build]
  [build.args]
    GO_VERSION = '1.27.2'

[env]
  PUBLIC_URL = "https://shop.kitik.tech"

[mounts]
  source = "wish_data"
  destination = "/data"

# Raw TCP service for Wish SSH & SFTP
[[services]]
  protocol = "tcp"
  internal_port = 2222
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 22
    handlers = []

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

# HTTP/HTTPS service for Go net/http downloads (automatically binds external 80 & 443)
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
